<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoMatte Detail — Curățare interior auto mobilă</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* Cyberpunk Palette */
    --bg-base: #050505;
    --bg-panel: #0c0d12;
    --bg-panel-alt: #13141c;
    
    --neon-cyan: #00F3FF;
    --neon-magenta: #FF0055;
    --neon-yellow: #FCEE0A;
    
    --text-main: #E2E8F0;
    --text-muted: #8492a6;
    
    --line: rgba(0, 243, 255, 0.15);
    --line-dark: rgba(255, 255, 255, 0.05);
    --grid-pattern: rgba(0, 243, 255, 0.03);
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}

  body {
    background-color: var(--bg-base);
    background-image: 
      linear-gradient(var(--grid-pattern) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-pattern) 1px, transparent 1px);
    background-size: 32px 32px;
    background-position: center top;
    color: var(--text-main);
    font-family:'IBM Plex Sans', sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }

  a{color:inherit; text-decoration:none;}
  img{max-width:100%; display:block;}

  .wrap{
    max-width:1080px;
    margin:0 auto;
    padding:0 24px;
  }

  h1,h2,h3{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    letter-spacing:0.03em;
    line-height:1.1;
  }

  .mono{
    font-family:'IBM Plex Mono', monospace;
    letter-spacing:0.05em;
  }

  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color: var(--neon-cyan);
    font-weight:600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .eyebrow::before {
    content: '';
    display: inline-block;
    width: 12px;
    height: 12px;
    background: var(--neon-cyan);
    clip-path: polygon(0 0, 100% 50%, 0 100%);
  }

  /* ---------- hazard divider (Industrial Warning) ---------- */
  .hazard{
    height: 4px;
    background:repeating-linear-gradient(
      -45deg,
      var(--neon-yellow),
      var(--neon-yellow) 10px,
      #000 10px,
      #000 20px
    );
    border-bottom: 1px solid rgba(252, 238, 10, 0.3);
  }

  /* ---------- header ---------- */
  header{
    position:sticky;
    top:0;
    z-index:50;
    background: rgba(12, 13, 18, 0.85);
    backdrop-filter: blur(12px);
    border-bottom:1px solid var(--line);
  }
  .header-inner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 24px;
    max-width:1080px;
    margin:0 auto;
  }
  .logo{
    font-family:'Oswald', sans-serif;
    color: var(--text-main);
    font-size:22px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.04em;
    text-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
  }
  .logo span{color:var(--neon-cyan);}

  /* ---------- Cyberpunk Buttons ---------- */
  .btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background: var(--neon-cyan);
    color: #000;
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:14px;
    letter-spacing:0.05em;
    padding:12px 24px;
    border:none;
    cursor:pointer;
    text-transform: uppercase;
    /* Colțuri tăiate specifice interfețelor tech */
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    transition: all 0.2s ease;
  }
  .btn:hover{
    background: var(--text-main);
    box-shadow: 0 0 20px rgba(0, 243, 255, 0.6);
    transform: translateY(-2px);
  }
  
  .btn-ghost{
    background: rgba(0, 243, 255, 0.05);
    color: var(--neon-cyan);
    border: 1px solid var(--neon-cyan);
    clip-path: none; /* Resetăm clip-path ca să se vadă borderul complet */
    border-radius: 2px;
  }
  .btn-ghost:hover{
    background: rgba(0, 243, 255, 0.15);
    box-shadow: inset 0 0 10px rgba(0, 243, 255, 0.2);
    transform: translateY(-2px);
  }
  .btn-sm{padding:9px 16px; font-size:13px;}

  /* ---------- hero ---------- */
  .hero{
    padding:80px 0 72px;
    position:relative;
    overflow:hidden;
  }
  .hero-grid{
    display:grid;
    grid-template-columns:1.2fr 0.8fr;
    gap:48px;
    align-items:center;
  }
  .hero h1{
    font-size:clamp(38px,6vw,62px);
    color:var(--text-main);
    margin-bottom:24px;
  }
  .hero h1 em{
    font-style:normal;
    color:var(--neon-magenta);
    text-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
  }
  .hero p.lede{
    font-size:17px;
    color:var(--text-muted);
    max-width:48ch;
    margin-bottom:32px;
  }
  .hero-ctas{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:32px;
  }
  .hero-meta{
    display:flex;
    gap:24px;
    flex-wrap:wrap;
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    color:var(--text-muted);
    letter-spacing:0.05em;
    text-transform: uppercase;
  }
  .hero-meta span {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .hero-meta span::before {
    content: '';
    display: block;
    width: 6px;
    height: 6px;
    background: var(--neon-magenta);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--neon-magenta);
  }
  .hero-meta strong{color:var(--text-main); font-weight:600;}

  /* ---------- HUD Style Photo Tags (Before/After Spots) ---------- */
  .photo-tag{
    position:relative;
    background: rgba(12, 13, 18, 0.7);
    backdrop-filter: blur(5px);
    border: 1px solid var(--line-dark);
    aspect-ratio:4/5;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
    padding:20px;
    text-align:center;
    box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8);
    transition: border-color 0.3s ease;
  }
  .photo-tag:hover {
    border-color: var(--line);
  }
  /* Targeting brackets */
  .photo-tag::before,.photo-tag::after {
    content:'';
    position:absolute;
    width:24px; height:24px;
    border:2px solid var(--neon-cyan);
    transition: all 0.3s ease;
  }
  .photo-tag::before{top:0; left:0; border-right:none; border-bottom:none;}
  .photo-tag::after{bottom:0; right:0; border-left:none; border-top:none;}
  
  .photo-tag .tag-icon{
    width:48px; height:48px;
    background: rgba(0, 243, 255, 0.05);
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    color:var(--neon-cyan);
    font-size:18px;
    clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); /* Hexagon */
  }
  .photo-tag .tag-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--text-muted);
  }

  /* ---------- section shell ---------- */
  section{padding:80px 0;}
  .section-head{
    max-width:60ch;
    margin-bottom:48px;
  }
  .section-head h2{
    font-size:clamp(28
